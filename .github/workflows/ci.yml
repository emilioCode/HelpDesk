name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The tests run while the image stage is built, so a failing test fails the build.
      - name: Run the unit and integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tests
          push: false
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests

  image:
    name: Build the front end and the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds the Angular app, publishes the API and assembles the runtime image.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  smoke:
    name: Start the stack and sign in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create the settings file
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Check the running app
        run: scripts/ci-smoke.sh http://localhost:8080
      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
