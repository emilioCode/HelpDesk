name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The tests run while the image stage is built, so a failing test fails the build.
      - name: Run the unit and integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tests
          push: false
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests

  image:
    name: Build the front end and the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The front end unit tests run first, so a failing test fails the job.
      - name: Run the front end unit tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: spa-tests
          push: false
          cache-from: type=gha,scope=spa-tests
          cache-to: type=gha,mode=max,scope=spa-tests
      # Builds the Angular app, publishes the API and assembles the runtime image.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  smoke:
    name: Start the stack and sign in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create the settings file
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Check the running app
        run: scripts/ci-smoke.sh http://localhost:8080
      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Coverage of the lines of code. The rule (.github/coverage-thresholds.json): 80% is what a change needs to be merged;
  # while a part is below it, its floor is the coverage it has, so it can only go up (scripts/coverage-gate.mjs).
  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run the tests with coverage
        run: dotnet test HelpDesk.Tests/HelpDesk.Tests.csproj --collect:"XPlat Code Coverage" --results-directory coverage/backend
      - name: Check the coverage against the rule
        run: node scripts/coverage-gate.mjs backend coverage/backend
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend
          retention-days: 14

  front-coverage:
    name: Front end coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HelpDesk/ClientApp/package-lock.json
      - name: Install the packages
        working-directory: HelpDesk/ClientApp
        run: npm ci
      - name: Run the tests with coverage
        working-directory: HelpDesk/ClientApp
        run: npm run coverage
      - name: Check the coverage against the rule
        run: node scripts/coverage-gate.mjs front HelpDesk/ClientApp/coverage/HelpDesk/coverage-summary.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: HelpDesk/ClientApp/coverage
          retention-days: 14
