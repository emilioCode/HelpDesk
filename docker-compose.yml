services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships for amd64. Apple Silicon runs it through emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./docker/db:/db:ro
    entrypoint: ["/bin/sh", "/db/init.sh"]
    restart: "no"

  web:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__HelpDesk: "Server=db;Database=HelpDeskDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env (at least 32 characters)}"
      Secrets__Key: "${SECRETS_KEY:?Set SECRETS_KEY in .env (at least 32 characters)}"
      Auth__Enforce: "${AUTH_ENFORCE:-false}"
    ports:
      - "${HELPDESK_PORT:-8080}:8080"

volumes:
  sqldata:
