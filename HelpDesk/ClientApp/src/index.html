<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HelpDesk</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#2451D6">
  <script>
    // Apply the saved look before the first paint so a dark page never flashes white.
    (function () {
      var v = null;
      try { v = localStorage.getItem('hd-theme'); } catch (e) {}
      var dark = v === 'dark' || (v !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  
</head>
<body>
  <app-root>Loading...</app-root>
</body>
</html>
