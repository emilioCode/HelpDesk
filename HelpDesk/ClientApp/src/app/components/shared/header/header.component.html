<header class="hd-topbar">
  <button type="button" class="hd-menu-button" aria-label="Abrir el menú" (click)="shell.toggle()">
    <hd-icon name="menu" [size]="20"></hd-icon>
  </button>

  <div class="hd-user">
    <div class="hd-user-text">
      <div class="hd-user-name">{{ service.getUser().nombre }}</div>
      <div class="hd-user-role">{{ role }} · {{ service.getUser().empresa }}</div>
    </div>
    <button type="button" class="hd-avatar" aria-haspopup="menu" [attr.aria-expanded]="menuOpen" aria-label="Menú del usuario" (click)="toggleMenu($event)">
      @if (service.hasImage(service.getUser().image)) {
        <img [src]="'data:image/jpeg;base64,' + service.getUser().image" alt="">
      } @else {
        {{ initials }}
      }
    </button>
    @if (menuOpen) {
      <div class="hd-user-menu" role="menu" (click)="$event.stopPropagation()">
        <div class="hd-theme" role="group" aria-label="Apariencia">
          <span class="hd-theme-label">Apariencia</span>
          <div class="hd-theme-options">
            <button type="button" [class.on]="theme.choice === 'system'" [attr.aria-pressed]="theme.choice === 'system'" title="Igual que el dispositivo" (click)="theme.set('system')"><hd-icon name="monitor" [size]="16"></hd-icon>Sistema</button>
            <button type="button" [class.on]="theme.choice === 'light'" [attr.aria-pressed]="theme.choice === 'light'" title="Tema claro" (click)="theme.set('light')"><hd-icon name="sun" [size]="16"></hd-icon>Claro</button>
            <button type="button" [class.on]="theme.choice === 'dark'" [attr.aria-pressed]="theme.choice === 'dark'" title="Tema oscuro" (click)="theme.set('dark')"><hd-icon name="moon" [size]="16"></hd-icon>Oscuro</button>
          </div>
        </div>
        <a role="menuitem" [routerLink]="['/profile']" (click)="menuOpen = false"><hd-icon name="user"></hd-icon>Mi perfil</a>
        <button type="button" role="menuitem" (click)="signOut()"><hd-icon name="log-out"></hd-icon>Cerrar sesión</button>
      </div>
    }
  </div>
</header>
