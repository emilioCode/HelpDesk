<!--START-->
<div>
  <div class="col-md-12">
    <!-- Box Comment -->
    <div class="box box-widget">
      <div class="box-header with-border">
        <!-- <div class="user-block">
          <img class="img-circle" src="../dist/img/user1-128x128.jpg" alt="User Image">
          <span class="username"><a href="#">Jonathan Burke Jr.</a></span>
          <span class="description">Shared publicly - 7:30 PM Today</span>
        </div> -->
        <!-- /.user-block -->
        <div class="box-tools">

        </div>
        <!-- /.box-tools -->
      </div>
      <!-- /.box-header -->
      <div class="box-body">
        <div class="alert" role="alert">
          <strong>Nota:</strong> Aquellas actividades marcadas como solución serán aquellas que se mostrarán en el reporte como actividades realizadas.
        </div>
      </div>
      <!-- /.box-body -->
      <div class="box-footer box-comments" id="divScroll" style="max-height: 300px;overflow:auto;" >
        <div class="box-comment" *ngFor="let item of traces">
          <!-- User image -->
          <img *ngIf="!service.hasImage(item.userImage)" class="img-circle img-sm" src="../../../../../assets/dist/img/photo_default.png" alt="User Image">
          <img *ngIf="service.hasImage(item.userImage)" class="img-circle img-sm" [src]="'data:image/jpeg;base64,'+ item.userImage" alt="User Image">
          <div class="comment-text">
                <span class="username">
                  {{ item.userName }}
                  <span class="text-muted pull-right">{{  service.setTime(item.hora)  }} {{ item.fecha | date:"dd/MM/yy" }}</span>
                </span><!-- /.username -->
            {{ item.texto }}
            <div class="hd-toggles"><span class="hd-toggle" [class.on]="item.favorito == true" role="button" tabindex="0" [attr.aria-pressed]="item.favorito == true" [title]="item.favorito == true ? 'Desmarcar como favorito' : 'Marcar como favorito'" (click)="toggle.emit({ item: item, field: 'favorito' })" (keyup.enter)="toggle.emit({ item: item, field: 'favorito' })"><i class="fa fa-star-o" *ngIf="item.favorito != true"></i><i class="fa fa-star" *ngIf="item.favorito == true"></i> Favorito</span><span class="hd-toggle" [class.on]="item.visibleAlCliente == true" role="button" tabindex="0" [attr.aria-pressed]="item.visibleAlCliente == true" [title]="item.visibleAlCliente == true ? 'El cliente lo ve. Pulsa para ocultarlo' : 'Mostrar al cliente en su seguimiento'" (click)="toggle.emit({ item: item, field: 'visibleAlCliente' })" (keyup.enter)="toggle.emit({ item: item, field: 'visibleAlCliente' })"><i class="fa fa-eye-slash" *ngIf="item.visibleAlCliente != true"></i><i class="fa fa-eye" *ngIf="item.visibleAlCliente == true"></i> Visible al cliente</span><span class="hd-toggle" [class.on]="item.etiquetado == true" role="button" tabindex="0" [attr.aria-pressed]="item.etiquetado == true" [title]="item.etiquetado == true ? 'Desmarcar como solución' : 'Marcar como solución'" (click)="toggle.emit({ item: item, field: 'etiquetado' })" (keyup.enter)="toggle.emit({ item: item, field: 'etiquetado' })"><i class="fa fa-bookmark-o" *ngIf="item.etiquetado != true"></i><i class="fa fa-bookmark" *ngIf="item.etiquetado == true"></i> Solución</span></div>
          </div>
          <!-- /.comment-text -->
        </div>
        <!-- /.box-comment -->
      </div>
      <!-- /.box-footer -->
      <div class="box-footer">
        <div [formGroup]="form.group">
          <img *ngIf="!service.hasImage(service.getUser().image)" src="../../../../../assets/dist/img/photo_default.png" class="img-responsive img-circle img-sm" alt="Alt Text">
          <img *ngIf="service.getUser() !=null && service.hasImage(service.getUser().image)" [src]="'data:image/jpeg;base64,'+ service.getUser().image" class="img-responsive img-circle img-sm" alt="Alt Text">
          <!-- .img-push is used to add margin to elements next to floating images -->
          <div class="img-push input-group">
            <input type="text" class="form-control " formControlName="texto" (keyup.enter)="add.emit()" placeholder="Escribe una actividad y pulsa Enter">
            <span class="input-group-btn">
              <button class="btn btn-primary btn-flat" (click)="add.emit()"  [disabled]="service.validateTrim( trace.texto )"><i class="fa fa-paper-plane" aria-hidden="true"></i> Colocar actividad</button>
            </span>
          </div>
        </div>
      </div>
      <!-- /.box-footer -->
    </div>
    <!-- /.box -->
  </div>
</div>
<!--END-->
