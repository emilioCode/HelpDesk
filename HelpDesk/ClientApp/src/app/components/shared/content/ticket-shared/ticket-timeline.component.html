<!--START-->
<div>
  <div class="col-md-12">
    <!-- Box Comment -->
    <div class="box box-widget">
      <div class="box-header with-border">
        <!-- <div class="user-block">
          <img class="img-circle" src="../dist/img/user1-128x128.jpg" alt="User Image">
          <span class="username"><a href="#">Jonathan Burke Jr.</a></span>
          <span class="description">Shared publicly - 7:30 PM Today</span>
        </div> -->
        <!-- /.user-block -->
        <div class="box-tools">

        </div>
        <!-- /.box-tools -->
      </div>
      <!-- /.box-header -->
      <div class="box-body">
        <div class="alert" role="alert">
          <strong>Nota:</strong> Aquellas actividades marcadas como solución serán aquellas que se mostrarán en el reporte como actividades realizadas.
        </div>
      </div>
      <!-- /.box-body -->
      <div class="box-footer box-comments" id="divScroll" style="max-height: 300px;overflow:auto;" >
        <div class="box-comment" *ngFor="let item of traces">
          <!-- User image -->
          <img *ngIf="!service.hasImage(item.userImage)" class="img-circle img-sm" src="../../../../../assets/dist/img/photo_default.png" alt="User Image">
          <img *ngIf="service.hasImage(item.userImage)" class="img-circle img-sm" [src]="'data:image/jpeg;base64,'+ item.userImage" alt="User Image">
          <div class="comment-text">
                <span class="username">
                  {{ item.userName }} <i class="fa fa-star-o" *ngIf="item.favorito != true" title="Marcar como favorito" (click)="toggle.emit({ item: item, field: 'favorito' })"></i><i class="fa fa-star" *ngIf="item.favorito == true" style="color:gold" title="Desmarcar como favorito" (click)="toggle.emit({ item: item, field: 'favorito' })"></i> <i class="fa fa-bookmark-o" *ngIf="item.etiquetado != true" title="Marcar como solución" (click)="toggle.emit({ item: item, field: 'etiquetado' })"></i><i class="fa fa-bookmark" *ngIf="item.etiquetado == true" title="Desmarcar como solución" style="color:tomato" (click)="toggle.emit({ item: item, field: 'etiquetado' })"></i>
                  <span class="text-muted pull-right">{{  service.setTime(item.hora)  }} {{ item.fecha | date:"dd/MM/yy" }}</span>
                </span><!-- /.username -->
            {{ item.texto }}
          </div>
          <!-- /.comment-text -->
        </div>
        <!-- /.box-comment -->
      </div>
      <!-- /.box-footer -->
      <div class="box-footer">
        <div>
          <img *ngIf="!service.hasImage(service.getUser().image)" src="../../../../../assets/dist/img/photo_default.png" class="img-responsive img-circle img-sm" alt="Alt Text">
          <img *ngIf="service.getUser() !=null && service.hasImage(service.getUser().image)" [src]="'data:image/jpeg;base64,'+ service.getUser().image" class="img-responsive img-circle img-sm" alt="Alt Text">
          <!-- .img-push is used to add margin to elements next to floating images -->
          <div class="img-push input-group">
            <input type="text" class="form-control " [(ngModel)]="trace.texto" (keyup.enter)="add.emit()" placeholder="Press enter to post comment" [disabled]="ticket.estado==service.ticketStatuses.completed && ticket.aprobadoPor!=null">
            <span class="input-group-btn">
              <button class="btn btn-primary btn-flat" (click)="add.emit()"  [disabled]="service.validateTrim( trace.texto )"><i class="fa fa-paper-plane" aria-hidden="true"></i> Colocar actividad</button>
            </span>
          </div>
        </div>
      </div>
      <!-- /.box-footer -->
    </div>
    <!-- /.box -->
  </div>
</div>
<!--END-->
