<!-- The order of the event that was clicked -->
<hd-dialog dialogId="exampleModal" [title]="selected?.title ?? ''" closeLabel="Ok">
  @if (selected) {
    <p><strong>{{ selected.role }}:</strong> {{ selected.who }}</p>
    <p><strong>Descripción:</strong> {{ selected.description }}</p>
    <p><a hdButton variant="primary" [href]="selected.path" target="_blank"><i class="fa fa-print"></i> Imprimir</a></p>
  }
</hd-dialog>
