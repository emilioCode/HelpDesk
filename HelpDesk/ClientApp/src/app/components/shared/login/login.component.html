<main class="hd-login">
  <section class="hd-login-card" aria-labelledby="login-title">
    <div class="hd-login-brand"><span class="hd-login-logo" aria-hidden="true">{{ service.aplicationNameMini1 }}</span>{{ title }}</div>
    <div class="hd-login-titles">
      <h1 id="login-title">Inicie sesión</h1>
      <p>Ingrese con su usuario para continuar.</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="singIn()" class="hd-login-form">
      <div class="hd-field">
        <label class="hd-label hd-required" for="login-user">Usuario</label>
        <input id="login-user" type="text" class="hd-input" formControlName="user" autocomplete="username" data-no-hints />
      </div>
      <div class="hd-field">
        <label class="hd-label hd-required" for="login-pwd">Contraseña</label>
        <input id="login-pwd" type="password" class="hd-input" formControlName="pwd" autocomplete="current-password" data-no-hints />
      </div>
      <button type="submit" class="hd-btn hd-btn-primary hd-btn-lg hd-btn-block" [disabled]="form.invalid || isLoading">
        <span [hidden]="isLoading">Ingresar</span><span [hidden]="!isLoading" class="hd-spin" role="status" aria-label="Ingresando"></span>
      </button>
    </form>
    <p class="hd-login-foot">{{ service.copyright }} &copy; 2020, {{ service.year }}</p>
  </section>
</main>
