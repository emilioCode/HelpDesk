@if (publicPage) {
    <router-outlet></router-outlet>
} @else {
<span *ngIf="service.getUser() != null" class="hd-shell">
    <app-menu></app-menu>
    <div class="hd-main">
        <app-header></app-header>
        <app-content></app-content>
        <app-footer></app-footer>
    </div>
</span>
<span *ngIf="service.getUser() == null">
    <app-login></app-login>
</span>
}
